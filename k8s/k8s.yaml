apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      labels:
        app: account
    spec:
      containers:
          - name: account
            image: pedrohmm1/account:51f0491
            imagePullPolicy: Always
            ports:
              - containerPort: 8080
            # "pronto" = porta 8080 aberta. O Tomcat só abre a porta no fim da inicialização do
            # Spring (~40 s, Flyway incluído), então o probe TCP basta, sem actuator. Sem ele, o
            # rollout derrubava o pod antigo assim que o novo container subia (503 no deploy).
            readinessProbe:
              tcpSocket:
                port: 8080
              initialDelaySeconds: 20
              periodSeconds: 5
              failureThreshold: 6
            resources:
              requests:
                memory: "256Mi"
                cpu: "250m"
              limits:
                memory: "512Mi"
                cpu: "500m"
            env:

              - name: DATABASE_HOST
                valueFrom:
                  configMapKeyRef:
                    name: postgres-configmap
                    key: POSTGRES_HOST

              - name: DATABASE_DB
                valueFrom:
                  configMapKeyRef:
                    name: postgres-configmap
                    key: POSTGRES_DB

              - name: DATABASE_PORT
                value: "5432"

              - name: DATABASE_USERNAME
                valueFrom:
                  secretKeyRef:
                    name: postgres-secrets
                    key: POSTGRES_USER

              - name: DATABASE_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: postgres-secrets
                    key: POSTGRES_PASSWORD

              # seed do primeiro ADMIN (Secret criado fora do Git, ver README)
              - name: ACCOUNT_ADMIN_EMAIL
                valueFrom:
                  secretKeyRef:
                    name: account-secrets
                    key: ACCOUNT_ADMIN_EMAIL

              - name: ACCOUNT_ADMIN_HASH
                valueFrom:
                  secretKeyRef:
                    name: account-secrets
                    key: ACCOUNT_ADMIN_HASH

              # heap de ate 50% do limite (256 MB de 512Mi); sobra para metaspace/threads
              - name: JAVA_TOOL_OPTIONS
                value: "-XX:MaxRAMPercentage=50"

---

apiVersion: v1
kind: Service
metadata:
  name: account
spec:
  selector:
    app: account
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
