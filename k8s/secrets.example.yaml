# Exemplo do Secret do account (SEM valores reais; nao aplicar como esta).
# O Secret real e criado a partir do .env local, que nao vai para o Git:
#   kubectl create secret generic account-secrets --from-env-file=.env
# Hash = Base64(SHA-256(senha)), ver README.
apiVersion: v1
kind: Secret
metadata:
  name: account-secrets
type: Opaque
stringData:
  ACCOUNT_ADMIN_EMAIL: ""
  ACCOUNT_ADMIN_HASH: ""
