spring:
  application:
    name: account

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_DB}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    baseline-on-migrate: true
    schemas: accounts
    # placeholders da migration de seed do ADMIN
    # (default vazio: a propria migration falha com mensagem clara)
    placeholders:
      admin_email: ${ACCOUNT_ADMIN_EMAIL:}
      admin_hash: ${ACCOUNT_ADMIN_HASH:}

  jpa:
    properties:
      hibernate:
        default_schema: accounts
